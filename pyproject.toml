[project]
name = "vnstock-api"
version = "0.1.0"
description = "API wrapper for vnstock library providing both REST and GraphQL APIs"
authors = [{ name = "Hieu Vo", email = "hieuvoquang87@gmail.com" }]
requires-python = ">=3.12,<4.0"
readme = "README.md"
dependencies = [
    "fastapi>=0.115.11,<0.116.0",
    "uvicorn>=0.34.0,<0.35.0",
    "pydantic>=2.10.6,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "redis>=5.2.1,<6.0.0",
    "pydantic-settings>=2.8.1,<3.0.0",
    "vnstock==3.2.3",
    "tenacity>=9.0.0,<10",
    "strawberry-graphql>=0.262.5,<0.263",
    "vnai>=2.0.0,<3",
]

[dependency-groups]
dev = [
    "flake8>=7.1.2,<8",
    "mypy>=1.15.0,<2",
    "black>=25.1.0,<26",
    "isort>=6.0.1,<7",
    "pytest>=8.3.5,<9.0.0",
    "pytest-cov>=6.0.0,<7",
    "httpx>=0.28.1,<0.29.0",
]

[tool.uv]

[tool.hatch.build.targets.sdist]
include = ["app"]

[tool.hatch.build.targets.wheel]
include = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
plugins = [
    "pydantic.mypy"
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "--cov=app --cov-report=term-missing --cov-report=xml --cov-report=html"

